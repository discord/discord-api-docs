name: Verify Docs Formatting

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdown_tables:
    name: Check Markdown Tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node v20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown Tables
        id: lint
        run: npm run lint

      - name: Explain how to fix lint failures
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          echo "::error title=Markdown tables are not formatted correctly::Run 'npm run fix:tables' from the tools/ directory and commit the changes. If the tables pass and this still fails, ESLint found problems in tools/; run 'npm run lint:fix' from the repo root."
